name: Lite Lua validation

on:
  push:
    branches: [lite-development]
    paths:
      - 'EXINTeamsLite/**'
      - '.github/workflows/lua-check.yml'
  pull_request:
    branches: [lite-development]
    paths:
      - 'EXINTeamsLite/**'
      - '.github/workflows/lua-check.yml'

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
      - name: Validate Lua syntax
        run: |
          luac5.1 -p EXINTeamsLite/Core.lua
          luac5.1 -p EXINTeamsLite/UI.lua
          lua5.1 EXINTeamsLite/tests/CoreSync.spec.lua
          lua5.1 EXINTeamsLite/tests/MultiClientSync.spec.lua

  package:
    needs: syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Lite-only installation archive
        run: |
          VERSION=$(sed -n 's/^## Version: //p' EXINTeamsLite/EXINTeamsLite.toc)
          mkdir -p package
          mkdir -p package/EXINTeamsLite
          cp EXINTeamsLite/*.lua EXINTeamsLite/*.toc EXINTeamsLite/README.md package/EXINTeamsLite/
          test -f package/EXINTeamsLite/EXINTeamsLite.toc
          test -f package/EXINTeamsLite/Core.lua
          test -f package/EXINTeamsLite/UI.lua
          test -f package/EXINTeamsLite/README.md
          test ! -e package/ForeverTeams
          cd package
          zip -r "EXINTeamsLite-${VERSION}.zip" EXINTeamsLite
      - name: Upload installation archive
        uses: actions/upload-artifact@v4
        with:
          name: EXINTeamsLite-install
          path: package/EXINTeamsLite-*.zip
          if-no-files-found: error
          retention-days: 30
